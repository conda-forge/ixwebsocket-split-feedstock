schema_version: 1

context:
  name: ixwebsocket
  version: "13.0.0"

recipe:
  name: ${{ name }}-split
  version: ${{ version }}

source:
  url: https://github.com/machinezone/IXWebSocket/archive/v${{ version }}.tar.gz
  sha256: 39620f5b7f85f806e8189cffde9c3ffbb37f8374fccf57d3e5aaced929690ea3
  patches:
    # Use conda-forge's CLI11 headers for the ws command.
    - use-system-cli11.patch
    # Link ws directly with the platform thread library for std::thread.
    - link-ws-threads.patch
    # Link the OpenSSL regression test to libraries it calls directly.
    - link-openssl-test.patch

build:
  number: 0
  skip:
    - win
  script: build

outputs:
  - package:
      name: libixwebsocket
    build:
      files:
        - if: linux
          then: lib/libixwebsocket.so.*
        - if: osx
          then: lib/libixwebsocket.*.dylib
    requirements:
      build:
        - ${{ compiler("c") }}
        - ${{ compiler("cxx") }}
        - ${{ stdlib("c") }}
        - cmake
        - make
      host:
        - zlib
        - openssl
        - cli11 >=2.6.2
      run_exports:
        - ${{ pin_subpackage("libixwebsocket", upper_bound="x.x.x") }}
    tests:
      - script: test ! -f ${PREFIX}/lib/libixwebsocket${SHLIB_EXT}

  - package:
      name: ixwebsocket
    build:
      files:
        - if: linux
          then: lib/libixwebsocket.so
        - if: osx
          then: lib/libixwebsocket.dylib
        - include/ixwebsocket/
        - lib/cmake/ixwebsocket/
        - lib/pkgconfig/ixwebsocket.pc
        - bin/ws
    requirements:
      build:
        - ${{ compiler("c") }}
        - ${{ compiler("cxx") }}
        - ${{ stdlib("c") }}
        - cmake
        - make
      host:
        - zlib
        - openssl
        - ${{ pin_subpackage("libixwebsocket", exact=True) }}
        - cli11 >=2.6.2
      run:
        - ${{ pin_subpackage("libixwebsocket", exact=True) }}
      run_exports:
        - ${{ pin_subpackage("libixwebsocket", upper_bound="x.x.x") }}
    tests:
      - script: ws --help
    about:
      license_file:
        - LICENSE.txt
        - CLI11-LICENSE.txt

about:
  homepage: https://machinezone.github.io/IXWebSocket/
  summary: IXWebSocket is a C++ library for WebSocket client and server development.
  description: |
    IXWebSocket is a C++ library for WebSocket client and server development. It has
    minimal dependencies (no boost), is very simple to use and support everything you'll
    likely need for websocket dev (SSL, deflate compression, compiles on most platforms, etc...).
  license: BSD-3-Clause
  license_file: LICENSE.txt
  documentation: https://machinezone.github.io/IXWebSocket
  repository: https://github.com/machinezone/IXWebSocket

extra:
  feedstock-name: ixwebsocket-split
  recipe-maintainers:
    - zklaus
    - timkpaine
